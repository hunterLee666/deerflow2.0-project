version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: deerflow-postgres
    environment:
      POSTGRES_USER: deerflow
      POSTGRES_PASSWORD: deerflow_secret
      POSTGRES_DB: deerflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deerflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deerflow-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: deerflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deerflow-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deerflow-backend
    environment:
      - DATABASE_URL=postgresql://deerflow:deerflow_secret@postgres:5432/deerflow
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - BACKEND_CORS_ORIGINS=["http://localhost:3000"]
      - DEERFLOW_CONFIG_PATH=/app/config.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app &&
             python -m venv .venv &&
             source .venv/bin/activate &&
             pip install -r requirements.txt &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - deerflow-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deerflow-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
             npm run dev"
    networks:
      - deerflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  deerflow-network:
    driver: bridge
