# Configuration for the Enterprise AI Agent System

# Config version
config_version: 1

# Models configuration
models:
  # OpenAI GPT-4
  - name: gpt-4
    display_name: GPT-4
    use: langchain_openai:ChatOpenAI
    model: gpt-4
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.7
    supports_vision: true

  # Anthropic Claude
  - name: claude-3-5-sonnet
    display_name: Claude 3.5 Sonnet
    use: langchain_anthropic:ChatAnthropic
    model: claude-3-5-sonnet-20241022
    api_key: $ANTHROPIC_API_KEY
    max_tokens: 8192
    supports_vision: true
    when_thinking_enabled:
      thinking:
        type: enabled

  # Google Gemini
  - name: gemini-2.5-pro
    display_name: Gemini 2.5 Pro
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.5-pro
    google_api_key: $GOOGLE_API_KEY
    max_tokens: 8192
    supports_vision: true

# Tools configuration
tools:
  # Built-in tools
  - name: present_files
    use: deerflow.tools.builtins.present_files:present_files_tool
    group: builtin

  - name: ask_clarification
    use: deerflow.tools.builtins.ask_clarification:ask_clarification_tool
    group: builtin

  - name: view_image
    use: deerflow.tools.builtins.view_image:view_image_tool
    group: builtin

# Tool groups
tool_groups:
  - name: builtin
    description: Built-in tools provided by DeerFlow

  - name: community
    description: Community tools for web search and data retrieval

  - name: custom
    description: Custom tools developed for this enterprise system

# Sandbox configuration
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  workspace_path: ./workspace
  uploads_path: ./uploads
  outputs_path: ./outputs

# Skills configuration
skills:
  path: ../skills
  container_path: /mnt/skills

# Title configuration
title:
  enabled: true
  max_words: 10
  max_chars: 100
  prompt_template: |
    Generate a concise title (under {max_words} words) for this conversation:

    {conversation}

    Title:

# Summarization configuration
summarization:
  enabled: true
  trigger:
    type: tokens
    threshold: 0.8
  keep:
    type: recent_messages
    count: 5

# Subagents configuration
subagents:
  enabled: true
  max_concurrent: 3
  timeout_minutes: 15

# Memory configuration
memory:
  enabled: true
  storage_path: ./memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# Checkpointer configuration
checkpointer:
  use: langgraph_checkpoint_sqlite:SqliteSaver
  path: ./checkpoints.db

# Tracing configuration
tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key: $LANGFUSE_PUBLIC_KEY
  secret_key: $LANGFUSE_SECRET_KEY